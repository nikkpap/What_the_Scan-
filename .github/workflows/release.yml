name: Build and release

# Push a tag like v1.0.2 (matching VERSION in WhatTheScan.pyw) and GitHub builds the
# Windows .exe and the Linux binary, then publishes them in a release with the .pyw.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: WhatTheScan-windows-x64
            asset: WhatTheScan-windows-x64.exe
          - os: ubuntu-22.04
            name: WhatTheScan-linux-x64
            asset: WhatTheScan-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "PyQt6>=6.6,<7" "PyMuPDF>=1.24" "python-docx>=1.1"

      - name: Build
        shell: bash
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name "${{ matrix.name }}"
          --icon assets/WhatTheScan.ico
          --collect-data docx
          --exclude-module PyQt6.QtWebEngineCore --exclude-module PyQt6.QtQml
          --exclude-module PyQt6.QtQuick --exclude-module PyQt6.QtMultimedia
          WhatTheScan.pyw

      - name: Checksum
        shell: bash
        run: |
          cd dist
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.asset }}*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version in the file must match the tag
        run: grep -q "^VERSION = \"${GITHUB_REF_NAME#v}\"" WhatTheScan.pyw

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add the .pyw script
        run: |
          cp WhatTheScan.pyw dist/
          cd dist
          sha256sum WhatTheScan.pyw > WhatTheScan.pyw.sha256
          ls -la

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "What the Scan?! $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
