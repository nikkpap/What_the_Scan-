name: Build and release

# Raise VERSION in WhatTheScan.pyw and push to main: if release v<VERSION> does not exist yet,
# GitHub builds the Windows .exe and the Linux binary and publishes them (with the .pyw) in a
# new release, creating the tag itself. Pushing a v* tag works too.
# Running the workflow by hand (Actions › Build and release › Run workflow) rebuilds the current
# version and replaces its files, e.g. to sign an existing release after adding the certificate.
# A push whose commit message contains [rebuild] does the same.
#
# Signing the Windows .exe: add two repository secrets (Settings › Secrets and variables › Actions)
#   WINDOWS_CERT_PFX       your code-signing certificate (.pfx) as base64 text
#   WINDOWS_CERT_PASSWORD  the .pfx password
# Without them the .exe is built unsigned.
on:
  push:
    branches: [main]
    paths: ["WhatTheScan.pyw", "RELEASE_NOTES.md", ".github/workflows/release.yml", "tools/build_offline.py"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      exists: ${{ steps.read.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' WhatTheScan.pyw | head -1)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || printf '%s' "$COMMIT_MESSAGE" | grep -qF '[rebuild]'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Rebuilding v$version."
          elif gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release v$version already exists, nothing to build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Building release v$version."
          fi

  test:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup code only uses names defined before it
        run: python tools/check_order.py WhatTheScan.pyw

      - name: First start on a clean PC (no NAPS2) reaches the installer without code errors
        run: |
          pip install "PyQt6>=6.6,<7" "PyMuPDF>=1.24,<2" "python-docx>=1.1"
          mkdir -p /tmp/home
          set +e
          env -i PATH="$PATH" HOME=/tmp/home QT_QPA_PLATFORM=offscreen timeout 300 \
            python WhatTheScan.pyw > startup.log 2>&1
          set -e
          cat startup.log
          grep -q "Installing NAPS2" startup.log
          if grep -E "Traceback|NameError|is not defined|AttributeError|ImportError" startup.log; then
            echo "::error::The first start hit a code error."; exit 1
          fi

  build:
    needs: [version, test]
    if: needs.version.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: WhatTheScan-windows-x64
            asset: WhatTheScan-windows-x64.exe
          - os: ubuntu-22.04
            name: WhatTheScan-linux-x64
            asset: WhatTheScan-linux-x64
          - os: macos-latest
            name: WhatTheScan-macos-arm64
            asset: WhatTheScan-macos-arm64.zip
          - os: macos-15-intel
            name: WhatTheScan-macos-x64
            asset: WhatTheScan-macos-x64.zip
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow "PyQt6>=6.6,<7" "PyMuPDF>=1.24,<2" "python-docx>=1.1"

      - name: Build
        if: runner.os != 'macOS'
        shell: bash
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name "${{ matrix.name }}"
          --icon assets/WhatTheScan.ico
          --collect-data docx
          --exclude-module PyQt6.QtWebEngineCore --exclude-module PyQt6.QtQml
          --exclude-module PyQt6.QtQuick --exclude-module PyQt6.QtMultimedia
          WhatTheScan.pyw

      - name: Build the macOS app
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -e
          APP="dist/What the Scan.app"
          pyinstaller --noconfirm --windowed --onedir --name "What the Scan" \
            --osx-bundle-identifier gr.nikkpap.whatthescan \
            --icon assets/WhatTheScan-icon.png --collect-data docx \
            --exclude-module PyQt6.QtWebEngineCore --exclude-module PyQt6.QtQml \
            --exclude-module PyQt6.QtQuick --exclude-module PyQt6.QtMultimedia \
            WhatTheScan.pyw
          VERSION=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' WhatTheScan.pyw | head -1)
          PLIST="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string What the Scan finds scanners on your network and shows when someone else is using the scanner." "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$PLIST" || true
          if [ -n "$MAC_CERT_P12" ]; then
            echo "Signing with Developer ID and notarizing"
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            security create-keychain -p temp "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p temp "$KEYCHAIN"
            echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k temp "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
            cat > "$RUNNER_TEMP/entitlements.plist" <<'PLIST_END'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict></plist>
          PLIST_END
            codesign --force --deep --options runtime --timestamp \
              --entitlements "$RUNNER_TEMP/entitlements.plist" --sign "$IDENTITY" "$APP"
            ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$APP"
            rm -f "$RUNNER_TEMP/cert.p12"
          else
            echo "::warning::No MACOS_CERT_P12 secret, so the Mac app is only ad-hoc signed (not notarized)."
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict "$APP" && echo "Signature OK"
          ditto -c -k --keepParent "$APP" "dist/${{ matrix.asset }}"

      - name: Sign the Windows .exe
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX) {
            Write-Host "::warning::No WINDOWS_CERT_PFX secret, so the .exe is not signed."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String(($env:CERT_PFX -replace '\s', '')))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            /d "What the Scan?!" /du "https://github.com/nikkpap/What_the_Scan-" `
            "dist\${{ matrix.asset }}"
          $code = $LASTEXITCODE
          Remove-Item $pfx -Force
          if ($code) { exit $code }
          Get-AuthenticodeSignature "dist\${{ matrix.asset }}" | Format-List Status, StatusMessage, SignerCertificate

      - name: Checksum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256";
          else shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"; fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.asset }}*

  offline:
    needs: [version, test]
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the offline package (all OS)
        run: |
          python tools/build_offline.py
          cd dist
          sha256sum WhatTheScan-offline.zip > WhatTheScan-offline.zip.sha256
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: WhatTheScan-offline
          path: dist/WhatTheScan-offline.zip*
          compression-level: 0

  release:
    needs: [version, build, offline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add the .pyw script
        run: |
          cp WhatTheScan.pyw dist/
          cd dist
          sha256sum WhatTheScan.pyw > WhatTheScan.pyw.sha256
          ls -la

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "What the Scan?! $TAG" --notes-file RELEASE_NOTES.md
          gh release upload "$TAG" dist/* --clobber
