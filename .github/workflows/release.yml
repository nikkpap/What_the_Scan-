name: Build and release

# Raise VERSION in WhatTheScan.pyw and push to main: if release v<VERSION> does not exist yet,
# GitHub builds the Windows .exe and the Linux binary and publishes them (with the .pyw) in a
# new release, creating the tag itself. Pushing a v* tag or running the workflow by hand works too.
on:
  push:
    branches: [main]
    paths: ["WhatTheScan.pyw", "RELEASE_NOTES.md", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      exists: ${{ steps.read.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' WhatTheScan.pyw | head -1)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release v$version already exists, nothing to build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Building release v$version."
          fi

  build:
    needs: version
    if: needs.version.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: WhatTheScan-windows-x64
            asset: WhatTheScan-windows-x64.exe
          - os: ubuntu-22.04
            name: WhatTheScan-linux-x64
            asset: WhatTheScan-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "PyQt6>=6.6,<7" "PyMuPDF>=1.24" "python-docx>=1.1"

      - name: Build
        shell: bash
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name "${{ matrix.name }}"
          --icon assets/WhatTheScan.ico
          --collect-data docx
          --exclude-module PyQt6.QtWebEngineCore --exclude-module PyQt6.QtQml
          --exclude-module PyQt6.QtQuick --exclude-module PyQt6.QtMultimedia
          WhatTheScan.pyw

      - name: Checksum
        shell: bash
        run: |
          cd dist
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.asset }}*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add the .pyw script
        run: |
          cp WhatTheScan.pyw dist/
          cd dist
          sha256sum WhatTheScan.pyw > WhatTheScan.pyw.sha256
          ls -la

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "What the Scan?! $TAG" --notes-file RELEASE_NOTES.md
          gh release upload "$TAG" dist/* --clobber
